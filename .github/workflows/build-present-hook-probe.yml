name: Build D3D11 Present Hook Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out mod repository
        uses: actions/checkout@v4

      - name: Check out MinHook
        uses: actions/checkout@v4
        with:
          repository: TsudaKageyu/minhook
          ref: v1.3.4
          path: minhook

      - name: Configure and build MinHook
        shell: pwsh
        run: |
          cmake `
            -S minhook `
            -B minhook-build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DBUILD_SHARED_LIBS=OFF

          cmake `
            --build minhook-build `
            --config Release

      - name: Locate MinHook library
        id: minhook
        shell: pwsh
        run: |
          $library = Get-ChildItem `
            -Path minhook-build `
            -Filter "minhook*.lib" `
            -Recurse |
            Where-Object { $_.Name -notlike "*.recipe" } |
            Select-Object -First 1

          if ($null -eq $library) {
            Write-Host "Contents of minhook-build:"
            Get-ChildItem minhook-build -Recurse
            throw "No MinHook library was found."
          }

          Write-Host "MinHook library: $($library.FullName)"

          "library=$($library.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append

      - name: Build probe DLL
        shell: pwsh
        run: |
          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found."
          }

          $vsInstall = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the C++ toolset was not found."
          }

          $vcvars = Join-Path `
            $vsInstall `
            "VC\Auxiliary\Build\vcvars64.bat"

          if (-not (Test-Path $vcvars)) {
            throw "vcvars64.bat was not found at '$vcvars'."
          }

          New-Item `
            -Path artifact `
            -ItemType Directory `
            -Force |
            Out-Null

          $minHookLibrary = '${{ steps.minhook.outputs.library }}'

          if (-not (Test-Path $minHookLibrary)) {
            throw "The resolved MinHook library does not exist: '$minHookLibrary'."
          }

          $command = @"
          call "$vcvars" &&
          cl /nologo /LD /EHsc /std:c++17 ^
            /I "minhook\include" ^
            "native\PresentHookProbe\PresentHookProbe.cpp" ^
            "$minHookLibrary" ^
            d3d11.lib dxgi.lib user32.lib ^
            /link ^
            /OUT:"artifact\MortuaryAssistantVR.PresentHookProbe.dll"
          "@

          cmd.exe /d /s /c $command

          if ($LASTEXITCODE -ne 0) {
            throw "The native probe build failed with exit code $LASTEXITCODE."
          }

          $output = "artifact\MortuaryAssistantVR.PresentHookProbe.dll"

          if (-not (Test-Path $output)) {
            throw "The native probe DLL was not created."
          }

      - name: Write SHA-256
        shell: pwsh
        run: |
          $path = "artifact\MortuaryAssistantVR.PresentHookProbe.dll"
          $hash = Get-FileHash $path -Algorithm SHA256

          "$($hash.Hash)  MortuaryAssistantVR.PresentHookProbe.dll" |
            Set-Content `
              "artifact\MortuaryAssistantVR.PresentHookProbe.dll.sha256.txt" `
              -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mortuary-assistant-vr-present-hook-probe
          path: artifact
          if-no-files-found: error
          retention-days: 14
